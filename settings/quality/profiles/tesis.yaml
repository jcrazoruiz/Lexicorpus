profile:
  code: tesis
  name: Perfil para tesis y documentos recepcionales
  version: "1.1"

thresholds:
  minimum_words: 5000
  maximum_numeric_line_ratio: 0.10
  maximum_repeated_line_ratio: 0.12
  maximum_uppercase_line_ratio: 0.12
  warning_long_line_length: 700

rules:
  severity_overrides:
    numeric_lines: INFO

  penalty_overrides:
    numeric_lines: 0
    repeated_lines: 5