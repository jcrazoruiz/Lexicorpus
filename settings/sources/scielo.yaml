source:
  code: scielo
  name: SciELO
  enabled: true
  acquisition_method: oai_pmh

  oai_base_url: "https://www.scielo.org.mx/oai/scielo-oai.php"

  metadata_prefix: oai_dc

  filters:
    accepted_languages:
      - es
      - spa
      - spanish
      - español

    accepted_resource_types:
      - article
      - journal article
      - artículo
      - articulo

    require_pdf: true

  limits:
    maximum_records_to_inspect: 10000
    maximum_documents_to_download: 10
    request_timeout_seconds: 45
    delay_between_requests_seconds: 1.5

  storage:
    raw_directory: data/raw/scielo
    metadata_directory: metadata/acquisition/scielo
    report_directory: reports/acquisition/scielo

  default_metadata:
    language: es
    thematic_domain: cientifico
    document_type: articulo_cientifico
    corpus_version: "1.1"

  supported_extensions:
    - .pdf